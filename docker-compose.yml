# Full stack: API + a worker pool + Redis.
#   docker compose up --build --scale worker=3
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - USE_FAKE_REDIS=0
    depends_on:
      - redis

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - USE_FAKE_REDIS=0
    depends_on:
      - redis
